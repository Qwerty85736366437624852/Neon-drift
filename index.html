<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Cats Air Hockey</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        canvas { border: 2px solid #000; background: #f0f0f0; }
    </style>
</head>
<body>
    <h1>Three Cats Air Hockey</h1>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const context = canvas.getContext('2d');

        const paddles = [{x: 30, y: 150, width: 15, height: 100, color: 'blue'}, {x: 755, y: 150, width: 15, height: 100, color: 'red'}];
        const puck = {x: canvas.width / 2, y: canvas.height / 2, radius: 15, speedX: 4, speedY: 4};

        let playerScores = [0, 0];
        let isGameRunning = true;

        function drawGame() {
            context.clearRect(0, 0, canvas.width, canvas.height);
            // Draw paddles
            paddles.forEach(paddle => {
                context.fillStyle = paddle.color;
                context.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            });
            // Draw puck
            context.fillStyle = 'black';
            context.beginPath();
            context.arc(puck.x, puck.y, puck.radius, 0, Math.PI * 2);
            context.fill();
            // Draw scores
            context.font = '20px Arial';
            context.fillText(`Player 1: ${playerScores[0]}`, 20, 30);
            context.fillText(`Player 2: ${playerScores[1]}`, canvas.width - 100, 30);
        }

        function updateGame() {
            puck.x += puck.speedX;
            puck.y += puck.speedY;
            // Collision with top/bottom
            if (puck.y <= puck.radius || puck.y >= canvas.height - puck.radius) {
                puck.speedY = -puck.speedY;
            }
            // Collision with paddles
            paddles.forEach(paddle => {
                if (puck.x - puck.radius < paddle.x + paddle.width && puck.x + puck.radius > paddle.x && puck.y > paddle.y && puck.y < paddle.y + paddle.height) {
                    puck.speedX = -puck.speedX;
                }
            });
            // Scoring
            if (puck.x <= 0) {
                playerScores[1]++;
                resetPuck();
            } else if (puck.x >= canvas.width) {
                playerScores[0]++;
                resetPuck();
            }
        }

        function resetPuck() {
            puck.x = canvas.width / 2;
            puck.y = canvas.height / 2;
            puck.speedX = (Math.random() > 0.5 ? 4 : -4);
            puck.speedY = Math.random() * 4 - 2;
        }

        function gameLoop() {
            if (isGameRunning) {
                drawGame();
                updateGame();
                requestAnimationFrame(gameLoop);
            }
        }

        // Event listeners for multi-touch controls
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                if (touch.clientX < canvas.width / 2) {
                    paddles[0].y = touch.clientY - paddles[0].height / 2;
                } else {
                    paddles[1].y = touch.clientY - paddles[1].height / 2;
                }
            }
        });

        gameLoop();
    </script>
</body>
</html>
